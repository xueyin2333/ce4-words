<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>四级单词</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23161d27'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle' font-family='sans-serif' fill='%233ddc97'%3E%E8%AF%8D%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#0d1117; --card:#161d27; --card2:#1d2733; --line:#25303e;
  --fg:#e6edf5; --mut:#8b98a8; --acc:#3ddc97; --acc2:#38bdf8;
  --bad:#ff7b7b; --warn:#ffc46b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);
  font-family:-apple-system,"PingFang SC","Noto Sans CJK SC","Source Han Sans SC","Microsoft YaHei",sans-serif;
  touch-action:manipulation}
body{min-height:100vh;min-height:100dvh;padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 8px)}
#app{max-width:560px;margin:0 auto;padding:14px 16px 24px}
#app.view-study{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;
  padding-bottom:calc(env(safe-area-inset-bottom) + 20px)}
#app.view-study .word-card{flex:1;justify-content:center;min-height:34vh;min-height:34dvh}
#app.view-study .acts{margin-top:auto;padding-top:16px}
#app.view-study .foot{margin-top:6px}
.muted{color:var(--mut)}
.tiny{font-size:12px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
h1,h2,h3{margin:0;font-weight:650}

/* 顶栏 */
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;min-height:34px}
.brand{font-size:19px;font-weight:700;letter-spacing:.5px}
.brand small{font-weight:400;font-size:12px;color:var(--mut);margin-left:6px}
.streak{font-size:13px;color:var(--warn);background:rgba(255,196,107,.1);
  border:1px solid rgba(255,196,107,.25);padding:5px 10px;border-radius:99px}
.back{width:34px;height:34px;border-radius:10px;background:var(--card);display:flex;
  align-items:center;justify-content:center;font-size:16px;color:var(--mut)}

/* 首页主卡 */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}
.hero-card{background:linear-gradient(160deg,#1a2532,#141b25 60%);margin-bottom:12px}
.hero-card .lab{font-size:13px;color:var(--mut)}
.bignum{font-size:46px;font-weight:750;line-height:1.1;margin:6px 0 2px;letter-spacing:-1px}
.bignum small{font-size:15px;color:var(--mut);font-weight:400;margin-left:6px;letter-spacing:0}
.bar{height:8px;border-radius:99px;background:#0b1016;overflow:hidden;margin:12px 0 8px}
.bar>i{display:block;height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .35s ease}
.bar.thin{height:5px;margin:0}
.primary{width:100%;margin-top:14px;padding:15px;border-radius:14px;font-size:16px;font-weight:650;
  background:linear-gradient(135deg,#3ddc97,#25c9b0);color:#062b20;
  box-shadow:0 6px 18px -8px rgba(61,220,151,.7)}
.primary:active{transform:scale(.985)}
.primary.alt{background:var(--card2);color:var(--fg);box-shadow:none;border:1px solid var(--line)}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:left}
.tile b{display:block;font-size:22px;font-weight:700;margin-bottom:2px}
.tile span{font-size:12px;color:var(--mut)}
.foot{margin-top:16px;text-align:center;line-height:1.7}
.foot a{color:var(--acc2);text-decoration:none}

/* 背单词 */
.sess-top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.sess-top .bar{flex:1}
.word-card{min-height:46dvh;display:flex;flex-direction:column;align-items:center;
  justify-content:center;text-align:center;padding:26px 18px;transition:background .2s}
.word-card .word{font-size:clamp(30px,9vw,42px);font-weight:700;letter-spacing:.5px;word-break:break-word}
.word-card .hint{margin-top:14px;font-size:13px;color:var(--mut)}
.word-card .visual{font-size:46px;line-height:1;margin-bottom:10px}
.word-card .visual.letter{width:66px;height:66px;border-radius:18px;display:flex;align-items:center;
  justify-content:center;font-size:30px;font-weight:700;color:var(--acc);
  background:rgba(61,220,151,.1);border:1px solid rgba(61,220,151,.22)}
.word-card .ipa{margin-top:7px;font-size:14px;color:var(--mut);letter-spacing:.3px}
.word-card .ex{margin-top:12px;font-size:13.5px;line-height:1.65;color:#9fb3c8;font-style:italic}
.word-card .ex .hit{color:#ff7b7b;font-style:normal;font-weight:700}
.word-card .exz{margin-top:5px;font-size:12.5px;line-height:1.6;color:#6f8194}
.word-card .mean{margin-top:16px;font-size:18px;line-height:1.55;color:#cfe3f5;
  padding-top:16px;border-top:1px dashed var(--line);width:100%}
.word-card.revealed{background:linear-gradient(165deg,#1b2a35,#161d27)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.btn{padding:15px;border-radius:14px;font-size:15.5px;font-weight:600;border:1px solid var(--line);
  background:var(--card)}
.btn.good{background:rgba(61,220,151,.12);border-color:rgba(61,220,151,.35);color:#7ff0c0}
.btn.bad{background:rgba(255,123,123,.1);border-color:rgba(255,123,123,.3);color:#ffb3b3}
.btn:disabled{opacity:.35}
.spk{margin-top:10px;font-size:13px;color:var(--acc2);padding:6px 12px;border-radius:99px;
  border:1px solid rgba(56,189,248,.25)}

/* 列表 */
.list{display:flex;flex-direction:column;gap:1px;margin-top:4px}
.item{padding:12px 2px;border-bottom:1px solid var(--line)}
.item .w{font-size:16px;font-weight:600}
.item .m{font-size:12.5px;color:var(--mut);margin-top:3px;line-height:1.45}
.item .n{float:right;font-size:11.5px;color:var(--bad);padding-top:4px}
.search{width:100%;margin:6px 0 2px;padding:12px 14px;border-radius:12px;font-size:16px;
  background:var(--card);border:1px solid var(--line);color:var(--fg);outline:none}
.empty{text-align:center;color:var(--mut);font-size:13px;padding:40px 0}

/* 设置 */
.set-row{display:flex;align-items:center;justify-content:space-between;padding:13px 0;
  border-bottom:1px solid var(--line);font-size:14.5px}
.seg{display:flex;gap:6px}
.seg button{padding:7px 11px;border-radius:9px;background:var(--card2);font-size:13px;color:var(--mut);
  border:1px solid transparent}
.seg button.on{background:rgba(61,220,151,.15);color:var(--acc);border-color:rgba(61,220,151,.35)}
.danger{color:var(--bad);font-size:14px;width:100%;text-align:center;padding:14px;
  border:1px solid rgba(255,123,123,.25);border-radius:14px;background:rgba(255,123,123,.07);margin-top:16px}
.notice{margin-top:12px;padding:10px 12px;border-radius:10px;font-size:12.5px;line-height:1.6;
  background:rgba(255,196,107,.08);border:1px solid rgba(255,196,107,.25);color:#f3d5a3}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.stat{background:var(--card2);border-radius:12px;padding:12px}
.stat b{display:block;font-size:20px}
.stat span{font-size:11.5px;color:var(--mut)}
h2{font-size:17px;margin-bottom:12px}
.sub{font-size:12.5px;color:var(--mut);line-height:1.6}
</style>
</head>

. 建议，劝告","/ədˈvaɪz/","The dentist advised me to brush three times a day.","💡","牙医建议我每天刷三次牙。"],["affect","v. 影响；感动","/əˈfɛkt/","The experience affected me deeply.","🌊","这段经历深深影响了我。"],["afford","v. 负担得起","/əˈfɔːd/","I think we can afford the extra hour it will take.  We can only afford to buy a small car at the moment.","","我觉得还挤得出这一小时。眼下我们只买得起一辆小车。"],["agency","n. 代理机构","/ˈeɪ.dʒən.si/","","",""],["aggressive","adj. 好斗的；积极进取的","/əˈɡɹɛs.ɪv/","","",""],["agriculture","n. 农业","/ˈæɡɹɪˌkʌltʃə/","","🌾",""],["alarm","n. 警报 v. 使惊慌","/əˈlɑːm/","The clock radio is a friendlier version of the cold alarm by the bedside.","","这台收音机闹钟比床头的冷冰冰闹钟更亲切。"],["alter","v. 改变，改动","/ˈɑl.tɚ/","","🔀",""],["alternative","n. 替代方案 adj. 可供选择的","/ɒl.ˈtɜː(ɹ).nə.tɪv/","","🗓",""],["amaze","v. 使惊奇","/əˈmeɪz/","He was amazed when he found that the girl was a robot.","","当他发现那姑娘是机器人时非常惊讶。"],["ambition","n. 雄心，抱负","/æmˈbɪ.ʃən/","My son, John, wants to be a firefighter very much. He has a lot of ambition.","","我儿子约翰很想当消防员，他很有抱负。"],["amount","n. 数量 v. 总计","/əˈmaʊnt/","The amount of atmospheric pollution threatens a health crisis.","","大气污染的程度预示着健康危机。"],["analyze","v. 分析","/ˈæn.ə.laɪz/","","🔍",""],["ancient","adj. 古代的","/ˈeɪn.ʃənt/","","",""],["announce","v. 宣布，通告","/əˈnaʊns/","","📣",""],["annual","adj. 每年的","/ˈæn.ju.əl/","I read the magazine, but I usually don't purchase the annuals.","","我读这本杂志，但一般不会买年刊。"],["anxious","adj. 焦虑的；渴望的","/ˈaŋ(k)ʃəs/","I could tell she was anxious as she was biting her nails.","😰","她咬着指甲，我能看出她很焦虑。"],["apologize","v. 道歉","/əˈpɒləd͡ʒaɪz/","My correspondent apologized for not answering my letter.","","我的笔友写信为没有回信而道歉。"],["appeal","v./n. 呼吁；吸引力","/əˈpiːl/","He made an appeal for volunteers to help at the festival.","🧲","他呼吁志愿者来帮忙筹备节日活动。"],["appear","v. 出现；显得","/əˈpiːɹ/","A great writer appeared at that time.","✨","那个时代出现了一位伟大的作家。"],["apply","v. 申请；应用","/əˈplaɪ/","","",""],["appoint","v. 任命；约定","/əˈpɔɪnt/","","",""],["appreciate","v. 感激；欣赏","/əˈpɹiː.si.eɪt/","","🙏",""],["approach","v. 接 <script>
(function(){
"use strict";
var KEY="ce4v1";
var DEF={ver:1,perDay:12,order:null,seen:{},learned:[],wrong:{},days:{},streak:0,lastDay:null};
var S=null, storageOK=true, view="home", sess=null, q="", toast=null;

function $(id){return document.getElementById(id);}
function hl(text,word){
  var t=esc(text);
  try{
    var base=String(word).replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
    var re=new RegExp("\\b("+base+"[a-z]*)","ig");
    t=t.replace(re,function(m){return '<span class="hit">'+m+'</span>';});
  }catch(e){}
  return t;
}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){storageOK=false;}}
function load(){
  var raw=null;
  try{raw=localStorage.getItem(KEY);}catch(e){storageOK=false;raw=null;}
  var s=null;
  if(raw){try{s=JSON.parse(raw);}catch(e){s=null;}}
  if(!s||s.ver!==1){s={};}
  S=Object.assign({},DEF,s);
  if(!Array.isArray(S.order)||S.order.length!==V.length){S.order=shuffle(V.map(function(_,i){return i;}));}
  if(!S.wrong){S.wrong={};}
  S.learned=Array.isArray(S.learned)?S.learned:[];
  save();return S;
}
function pad(n){return n<10?"0"+n:""+n;}
function dayKey(d){d=d||new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function ydayKey(){return dayKey(new Date(Date.now()-86400000));}
function today(){var k=dayKey();if(!S.days[k]){S.days[k]={plan:null,done:[],right:0,wrong:0};}return S.days[k];}
function plan(){var d=today();if(!d.plan){d.plan=S.order.filter(function(i){return !S.seen[i];}).slice(0,S.perDay);save();}return d.plan;}
function remaining(){var d=today();return d.plan.filter(function(i){return d.done.indexOf(i)<0;});}
function wrongList(){return Object.keys(S.wrong).map(Number).filter(function(i){return S.wrong[i]>0;})
  .sort(function(a,b){return S.wrong[b]-S.wrong[a];});}
function bumpStreak(){var k=dayKey();if(S.lastDay===k){return;}
  S.streak=(S.lastDay===ydayKey())?(S.streak||0)+1:1;S.lastDay=k;save();}

/* ---------- 视图 ---------- */
function render(){
  var app=$("app");
  app.className="view-"+view;
  if(view==="home"){app.innerHTML=homeHTML();}
  else if(view==="study"||view==="summary"){app.innerHTML=studyHTML();}
  else if(view==="wrong"){app.innerHTML=wrongHTML();}
  else if(view==="list"){app.innerHTML=listHTML();}
  else if(view==="settings"){app.innerHTML=settingsHTML();}
  window.scrollTo(0,0);
  if(view==="study"){bindCard();}
  if(view==="list"){var i=$("q");if(i){i.value=q;i.addEventListener("input",onSearch);}}
}
function topBar(title,extra){
  return '<div class="top"><button class="back" data-act="home">‹</button><div class="brand">'+title+'</div>'+(extra||'<div style="width:34px"></div>')+'</div>';
}
function homeHTML(){
  var d=today(),pl=plan(),left=remaining(),n=left.length,total=pl.length;
  var doneCnt=pl.length-left.length;
  var pct=total?Math.round(doneCnt/total*100):(pl.length===0?100:0);
  var allDone=Object.keys(S.seen).length>=V.length;
  var mainLabel=n>0?(doneCnt>0?"继续背（剩 "+n+" 个）":"开始背 "+n+" 个"):(allDone?"词库已全部背过 🎉":"今日已完成，再背一组");
  var wl=wrongList().length;
  var h='<div class="top"><div class="brand">四级单词<small>'+(S.perDay)+' 个/天'+"</small></div>"+
        '<div class="streak">🔥 连续 '+(S.streak||0)+' 天</div></div>';
  h+='<div class="card hero-card"><div class="lab">'+(n>0?"今天还要背":"今天已完成")+'</div>'+
     '<div class="bignum">'+(n>0?n:doneCnt)+'<small>个</small></div>'+
     '<div class="bar"><i style="width:'+pct+'%"></i></div>'+
     '<div class="tiny muted">今日 '+doneCnt+' / '+total+'　·　累计 '+S.learned.length+' / '+V.length+'</div>'+
     '<button class="primary" data-act="start">'+mainLabel+"</button></div>";
  h+='<div class="grid2"><button class="tile" data-act="go:wrong"><b>'+wl+'</b><span>错词复习</span></button>'+
     '<button class="tile" data-act="go:list"><b>'+S.learned.length+'</b><span>已学 / 词表</span></button></div>';
  if(storageOK===false){h+='<div class="notice">⚠️ 浏览器没给本地存储权限，这一轮进度存不下来。请告诉我，我换一种打开方式。</div>';}
  h+='<div class="foot tiny muted">从 <b style="color:#c7d3e0">'+V.length+'</b> 个四级核心词里抽题　·　<a href="#" data-act="go:settings">设置</a></div>';
  return h;
}
function studyHTML(){
  if(view==="summary"){return summaryHTML();}
  var s=sess;if(!s){return homeHTML();}
  var w=V[s.queue[0]];
  var answered=s.answered||0, rest=s.queue.length;
  var pct=Math.round(answered/(answered+rest)*100);
  var ipa=w[2]||"", ex=w[3]||"", icon=w[4]||"", exz=w[5]||"";
  var visual=icon?('<div class="visual">'+icon+'</div>')
                 :('<div class="visual letter">'+esc(String(w[0]).charAt(0).toUpperCase())+'</div>');
  var h='<div class="sess-top"><button class="back" data-act="quit">✕</button>'+
    '<div class="bar thin"><i style="width:'+pct+'%"></i></div>'+
    '<div class="tiny muted" style="min-width:64px;text-align:right">'+(answered+1)+'/'+(answered+rest)+"</div></div>";
  h+='<div class="card word-card'+(s.revealed?" revealed":"")+'" id="wordCard">'+visual+
     '<div class="word">'+esc(w[0])+'</div>'+
     (ipa?'<div class="ipa">'+esc(ipa)+'</div>':'')+
     (s.revealed?('<div class="mean">'+esc(w[1])+'</div>'+
        (ex?('<div class="ex">“'+hl(ex,w[0])+'”</div>'+(exz?'<div class="exz">'+esc(exz)+'</div>':'')):''))
                :'<div class="hint">点一下卡片看释义</div>')+
     (s.revealed?'<button class="spk" data-act="speak" data-w="'+esc(w[0])+'">🔊 读一下</button>':'')+
     '</div>';
  h+='<div class="acts">'+
     '<button class="btn bad" data-act="ans:0"'+(s.revealed?"":" disabled")+'>想不起来</button>'+
     '<button class="btn good" data-act="ans:1"'+(s.revealed?"":" disabled")+'>记住了</button></div>';
  if(!s.revealed){h+='<div class="foot tiny muted">先看释义，再判断记没记住</div>';}
  return h;
}
function summaryHTML(){
  var s=sess,d=today(),left=remaining(),pl=plan();
  var acc=s.answered?Math.round(s.right/s.answered*100):0;
  var h='<div class="top"><div class="brand">本轮完成</div><div class="streak">🔥 '+(S.streak||0)+' 天</div></div>';
  h+='<div class="card"><h2>🎉 '+(s.mode==="review"?"错词复习":"新词学习")+'完成</h2>'+
     '<div class="stats"><div class="stat"><b>'+s.right+'</b><span>记住</span></div>'+
     '<div class="stat"><b>'+s.wrong+'</b><span>没记住</span></div>'+
     '<div class="stat"><b>'+acc+'%</b><span>正确率</span></div>'+
     '<div class="stat"><b>'+S.learned.length+'</b><span>累计已学</span></div></div>';
  h+='<div class="tiny muted" style="margin-top:12px;line-height:1.7">今日进度 '+ (pl.length-left.length) +' / '+pl.length +
     (left.length>0?'　·　还剩 '+left.length+' 个没背':'　·　今日计划已完成')+'</div>';
  if(left.length>0){h+='<button class="primary" data-act="start">继续背剩下的 '+left.length+' 个</button>';}
  var wl=wrongList().length;
  if(wl>0){h+='<button class="primary alt" data-act="go:wrong">去复习错词（'+wl+'）</button>';}
  h+='<button class="primary alt" data-act="home">回到首页</button></div>';
  return h;
}
function wrongHTML(){
  var ids=wrongList();
  var h=topBar("错词本","<div class=\"tiny muted\">"+ids.length+" 个</div>");
  if(!ids.length){return h+'<div class="empty">还没有错词，继续保持 👍</div>';}
  h+='<button class="primary" data-act="review">开始复习这 '+ids.length+' 个词</button><div class="list">';
  ids.forEach(function(i){h+='<div class="item"><span class="n">错 '+(S.wrong[i])+' 次</span>'+
    '<div class="w">'+esc(V[i][0])+(V[i][2]?' <span style="font-size:12px;color:var(--mut);font-weight:400">'+esc(V[i][2])+'</span>':'')+
    '</div><div class="m">'+esc(V[i][1])+'</div></div>';});
  return h+'</div>';
}
function listHTML(){
  var h=topBar("词表","<div class=\"tiny muted\">"+S.learned.length+" / "+V.length+"</div>");
  h+='<input id="q" class="search" placeholder="搜单词或中文释义" autocomplete="off">';
  h+='<div id="listBody">'+listBodyHTML()+'</div>';
  return h;
}
function listBodyHTML(){
  var kw=q.trim().toLowerCase(),i,w,h="",n=0;
  for(i=0;i<V.length;i++){
    w=V[i];
    if(kw&&!(w[0].toLowerCase().indexOf(kw)>=0||w[1].toLowerCase().indexOf(kw)>=0)){continue;}
    n++;if(n>200){break;}
    h+='<div class="item"><span class="n" style="color:'+(S.seen[i]?"var(--acc)":"var(--mut)")+'">'+
      (S.seen[i]?"已学":"未学")+'</span><div class="w">'+esc(w[0])+
      (w[2]?' <span style="font-size:12px;color:var(--mut);font-weight:400">'+esc(w[2])+'</span>':'')+'</div>'+
      '<div class="m">'+esc(w[1])+'</div></div>';
  }
  return h?('<div class="list">'+h+'</div>'):'<div class="empty">没找到</div>';
}
function settingsHTML(){
  var seg=[8,12,16,20].map(function(n){return '<button class="'+(S.perDay===n?"on":"")+
    '" data-act="perday:'+n+'">'+n+"</button>";}).join("");
  var h=topBar("设置");
  h+='<div class="card"><div class="set-row"><div>每日新词<small class="muted" style="display:block;font-size:11.5px">只影响之后每天的计划</small></div>'+
     '<div class="seg">'+seg+'</div></div>'+
     '<div class="set-row"><div>累计已学</div><div>'+S.learned.length+' / '+V.length+'</div></div>'+
     '<div class="set-row"><div>错词</div><div>'+wrongList().length+' 个</div></div>'+
     '<div class="set-row" style="border:0"><div>连续打卡</div><div>'+(S.streak||0)+' 天</div></div>'+
     '<button class="danger" data-act="'+(armed?"reset2":"reset")+'">'+
       (armed?"再点一次，确认清空全部进度":"清空进度，从第一个词重新开始")+'</button></div>';
  h+='<div class="sub" style="margin-top:16px">词库说明：'+V.length+' 个四级高频核心词，按字母顺序分块、随机打乱顺序出题。'+
     '进度只存在这台手机的浏览器里，换浏览器或清缓存会丢。</div>';
  h+='<div class="sub" style="margin-top:8px">小提示：把这一页加入浏览器收藏（工具 → 添加收藏），下次从收藏一点就进来；页面已经存进手机离线缓存，没网也能用。</div>';
  return h;
}

/* ---------- 交互 ---------- */
function onSearch(e){
  q=e.target.value;
  var b=$("listBody");if(b){b.innerHTML=listBodyHTML();}
}
function bindCard(){
  var c=$("wordCard");
  if(c&&!sess.revealed){c.addEventListener("click",function(){sess.revealed=true;render();});}
}
function newSession(ids,mode){
  sess={queue:ids.slice(),mode:mode||"new",revealed:false,right:0,wrong:0,answered:0,mistakes:{}};
  view="study";render();
}
function startStudy(bonus){
  var left=remaining();
  if(!left.length){
    var d=today();
    var next=S.order.filter(function(i){return !S.seen[i];});
    if(!next.length){view="study";sess=null;alert("词库里的词已经全部背过一遍了，去错词本复习吧。");view="home";render();return;}
    var add=next.slice(0,S.perDay);
    d.plan=(d.plan||[]).concat(add);save();left=add;
  }
  newSession(left,"new");
}
function answer(ok){
  var s=sess;if(!s||s.queue.length===0){return;}
  var i=s.queue.shift(),d=today();
  s.answered++;s.revealed=false;
  if(S.lastDay!==dayKey()){bumpStreak();}   // 今天第一次作答就算打卡
  if(ok){
    s.right++;
    if(!S.seen[i]){S.seen[i]=1;S.learned.push(i);}
    if(d.plan&&d.plan.indexOf(i)>=0&&d.done.indexOf(i)<0){d.done.push(i);}
    d.right++;
    if(s.mode==="review"){
      S.wrong[i]=(S.wrong[i]||0)-1;
      if(S.wrong[i]<=0){delete S.wrong[i];}
    }
  }else{
    s.wrong++;d.wrong++;
    S.wrong[i]=(S.wrong[i]||0)+1;
    if(!S.seen[i]){S.seen[i]=1;S.learned.push(i);}
    var times=s.mistakes[i]||0;s.mistakes[i]=times+1;
    if(times<1){s.queue.push(i);}   // 同一轮里再考一次
  }
  if(s.queue.length===0){bumpStreak();view="summary";}
  save();render();
}
function speak(w){
  try{
    if(!window.speechSynthesis){return;}
    var u=new SpeechSynthesisUtterance(w);u.lang="en-US";u.rate=.9;
    speechSynthesis.cancel();speechSynthesis.speak(u);
  }catch(e){}
}
var armed=false;
function resetAll(){
  S=load();S.ver=1;S.seen={};S.learned=[];S.wrong={};S.days={};S.streak=0;S.lastDay=null;
  S.order=shuffle(V.map(function(_,i){return i;}));
  save();view="home";render();
}
document.addEventListener("click",function(e){
  var el=e.target.closest("[data-act]");
  if(!el){return;}
  var a=el.getAttribute("data-act");
  e.preventDefault();
  if(a==="home"){view="home";sess=null;render();}
  else if(a==="start"){startStudy();}
  else if(a.indexOf("go:")===0){view=a.slice(3);q="";armed=false;render();}
  else if(a==="ans:0"){answer(false);}
  else if(a==="ans:1"){answer(true);}
  else if(a==="quit"){view="home";sess=null;render();}
  else if(a==="review"){var ids=wrongList();if(ids.length){newSession(ids,"review");}}
  else if(a.indexOf("perday:")===0){S.perDay=Number(a.split(":")[1]);save();render();}
  else if(a==="reset"){armed=true;render();}
  else if(a==="reset2"){armed=false;resetAll();}
  else if(a==="speak"){speak(el.getAttribute("data-w")||"");}
});
document.addEventListener("keydown",function(e){
  if(view!=="study"||!sess){return;}
  if(e.key===" "||e.key==="Enter"){if(!sess.revealed){sess.revealed=true;render();}e.preventDefault();}
  if(e.key==="1"){answer(false);}if(e.key==="2"){answer(true);}
});
document.addEventListener("visibilitychange",function(){
  if(!document.hidden){var k_u=dayKey();if(S.days[k_u]&&false){}}
});
load();
if(!V||!V.length){$("app").innerHTML='<div class="empty">词库未加载</div>';}else{render();}
})();
</script>
